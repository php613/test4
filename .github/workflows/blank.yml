name: Download Latest Patriotim Automatically

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'קישור ספציפי (השאר ריק להורדה אוטומטית של הפרק האחרון)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp
          # התקנת deno לפענוח JavaScript מיוטיוב
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Download Audio
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.custom_url }}"
          else
            TARGET_URL="ytsearch1:עכשיו 14 הפטריוטים התוכנית המלאה"
          fi
          
          echo "מוריד מ: $TARGET_URL"
          
          # שימוש בלקוח Android ו-iOS כדי לעקוף את חסימת הבוטים של יוטיוב
          yt-dlp \
            --extractor-args "youtube:player_client=android,ios" \
            -x --audio-format mp3 \
            -o "episode.mp3" \
            "$TARGET_URL"

      - name: Split audio into .dat chunks
        run: |
          split -b 20M -d --additional-suffix=.dat episode.mp3 chunk_
          ls -lh chunk_*.dat

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="patriotim-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" chunk_*.dat \
            --title "הפטריוטים $(date +'%d/%m/%Y %H:%M')" \
            --notes "קבצי שמע מפוצלים"
