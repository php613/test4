name: Paged Search Downloader (ZIP to 2GB DAT)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט חופשי לחיפוש (או קישור ישיר)'
        required: true
        type: string
      start_index:
        description: 'מאיזו תוצאה להתחיל? (1 לסבב ראשון, 6 לסבב שני וכו)'
        required: true
        default: '1'
        type: string
      count:
        description: 'כמה תוצאות להוריד בסבב הזה?'
        required: true
        default: '5'
        type: string
      quality:
        description: 'איכות וידאו מקסימלית'
        required: true
        default: '720'
        type: choice
        options:
          - '480'
          - '720'
          - '1080'

permissions:
  contents: write

jobs:
  download-pack-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ytdlp-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. קאש עבור Deno
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      # 3. התקנת כלים והרמת שירותים במקביל
      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp zip

          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider

      # 4. חיפוש מדורג לפי טווח תוצאות
      - name: Download Videos with Pagination
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          START: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads

          # חישוב אינדקס הסיום
          END=$(( START + COUNT - 1 ))
          echo "מוריד תוצאות מ-$START עד $END עבור החיפוש: '$QUERY' באיכות ${HEIGHT}p..."

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${END}:${QUERY}"
          fi

          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --playlist-items "${START}:${END}" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
            --merge-output-format mp4 \
            -o "downloads/%(playlist_index)02d - %(title).100s.%(ext)s" \
            "$TARGET_URL"

          echo "הסרטונים שהורדו בסבב הנוכחי:"
          ls -lh downloads/

      # 5. דחיסה מהירה ל-ZIP ומחיקת תיקיית הוידאו
      - name: Package to ZIP
        run: |
          echo "אורז את הסרטונים ל-ZIP במצב אחסון מהיר..."
          zip -0 -r search_results.zip downloads/
          rm -rf downloads/

      # 6. פיצול לנתחי 1950MB עם סיומת dat
      - name: Split ZIP into 2GB DAT parts
        run: |
          split -b 1950M -d --additional-suffix=.dat search_results.zip search_part_
          rm -f search_results.zip
          ls -lh search_part_*.dat

      # 7. העלאה ל-Release
      - name: Upload DAT parts to GitHub Release
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          START: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END=$(( START + COUNT - 1 ))
          TAG="search-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" search_part_*.dat \
            --title "תוצאות חיפוש: $QUERY (תוצאות $START-$END)" \
            --notes "קובץ ZIP מפוצל המכיל את תוצאות $START עד $END עבור החיפוש: '$QUERY'."
