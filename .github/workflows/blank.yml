name: YouTube Audio to GitHub Releases (.dat)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש או קישור ישיר לסרטון'
        required: true
        default: 'עכשיו 14 הפטריוטים פרק מלא'
        type: string

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP לחסכון בזמן
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-audio-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. התקנת כלים, רשת וספריות
      - name: Setup Tools & Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          pip install -U "yt-dlp[default,curl-cffi]"

      # 3. הכנת עוגיות במידה וקיימות
      - name: Prepare Auth Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "הוגדרו עוגיות אימות מול יוטיוב."
          fi

      # 4. הורדת שמע והמרה לסיומת dat
      - name: Download Audio and Rename to .dat
        env:
          QUERY: ${{ github.event.inputs.search_query }}
        run: |
          mkdir -p downloads

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch1:${QUERY}"
          fi

          COOKIE_ARGS=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARGS="--cookies cookies.txt"
          fi

          # הורדת השמע הטוב ביותר וחילוץ ל-MP3
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            $COOKIE_ARGS \
            -N 8 \
            --socket-timeout 20 \
            --retries 3 \
            --fragment-retries 3 \
            --windows-filenames \
            -x \
            --audio-format mp3 \
            --audio-quality 0 \
            -o "downloads/%(title).100s.%(ext)s" \
            "$TARGET_URL"

          # איתור הקובץ שירד ושינוי הסיומת ל-.dat
          ORIG_FILE=$(find downloads -type f \( -name "*.mp3" -o -name "*.m4a" -o -name "*.opus" \) | head -n 1)

          if [ -z "$ORIG_FILE" ]; then
            echo "❌ לא נמצא קובץ שמע."
            exit 1
          fi

          DAT_FILE="${ORIG_FILE%.*}.dat"
          mv "$ORIG_FILE" "$DAT_FILE"
          echo "✅ הקובץ שונה בהצלחה לשם: $DAT_FILE"

      # 5. יצירת GitHub Release והעלאת קובץ ה-dat
      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAT_FILE=$(find downloads -type f -name "*.dat" | head -n 1)

          if [ -z "$DAT_FILE" ]; then
            echo "❌ לא נמצא קובץ .dat להעלאה."
            exit 1
          fi

          TAG_NAME="patriotim-audio-$(date +'%Y%m%d-%H%M')"
          RELEASE_TITLE="הפטריוטים (שמע) - $(date +'%d/%m/%Y')"

          echo "🚀 מעלה את הקובץ: $DAT_FILE ל-Release: $TAG_NAME"

          gh release create "$TAG_NAME" "$DAT_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "קובץ שמע שהורד מיוטיוב בסיומת dat"

          rm -f cookies.txt
