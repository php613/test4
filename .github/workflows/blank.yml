name: Download Videos by Search Query (ZIP to 2GB DAT)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט חופשי לחיפוש ביוטיוב (או קישור ישיר לערוץ / פלייליסט)'
        required: true
        type: string
      max_results:
        description: 'כמות סרטונים מקסימלית להורדה'
        required: true
        default: '5'
        type: string
      quality:
        description: 'איכות וידאו מקסימלית'
        required: true
        default: '720'
        type: choice
        options:
          - '480'
          - '720'
          - '1080'

permissions:
  contents: write

jobs:
  download-pack-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ytdlp-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. קאש עבור Deno
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      # 3. התקנת כלים והרמת שירותים במקביל
      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp zip

          # הרמת BotGuard ב-Docker
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          # הפעלת WARP
          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          # התקנת Deno במידה ולא נטען מהקאש
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider

      # 4. חיפוש חופשי והורדה מואצת
      - name: Download Videos by Search
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          MAX: ${{ github.event.inputs.max_results }}
          HEIGHT: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads
          
          # אם הוזן קישור ישיר - מורידים ממנו, אחרת מבצעים חיפוש חופשי ביוטיוב
          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${MAX}:${QUERY}"
          fi

          echo "מחפש ומוריד עד $MAX סרטונים עבור: '$QUERY' באיכות ${HEIGHT}p..."
          
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --max-downloads "$MAX" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
            --merge-output-format mp4 \
            -o "downloads/%(autonumber)02d - %(title).100s.%(ext)s" \
            "$TARGET_URL"

          echo "הסרטונים שהורדו בהצלחה:"
          ls -lh downloads/

      # 5. דחיסה מהירה ל-ZIP ומחיקת תיקיית הוידאו
      - name: Package to ZIP
        run: |
          echo "אורז את כל הסרטונים ל-ZIP במצב אחסון מהיר..."
          zip -0 -r search_results.zip downloads/
          rm -rf downloads/

      # 6. פיצול לנתחי 1950MB עם סיומת dat
      - name: Split ZIP into 2GB DAT parts
        run: |
          echo "מפצל את ה-ZIP לחלקים של עד 1950MB..."
          split -b 1950M -d --additional-suffix=.dat search_results.zip search_part_
          rm -f search_results.zip
          
          echo "רשימת הקבצים המוכנים להעלאה:"
          ls -lh search_part_*.dat

      # 7. העלאה ל-Release
      - name: Upload DAT parts to GitHub Release
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="search-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" search_part_*.dat \
            --title "תוצאות חיפוש: $QUERY ($(date +'%d/%m/%Y %H:%M'))" \
            --notes "קבצי DAT מפוצלים עד 2GB המכילים את תוצאות החיפוש עבור '$QUERY'."
