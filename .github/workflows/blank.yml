name: High Quality YouTube to Google Drive (Streaming Upload)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש או קישור ישיר לסרטון/פלייליסט'
        required: true
        type: string
      count:
        description: 'כמה סרטונים להוריד ולהעלות?'
        required: true
        default: '3'
        type: string
      quality:
        description: 'איכות וידאו מקסימלית (אם לא קיים, יירד המקסימום האפשרי)'
        required: true
        default: '1080'
        type: choice
        options:
          - '720'
          - '1080'
          - '1440'
          - '2160'

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gdrive-v2
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. קאש עבור Deno
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      # 3. התקנת כלים, שירותים וספריות
      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp

          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # 4. הכנת סקריפט העלאה יחידני
      - name: Prepare Upload Script
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SA_KEY" > sa_key.json

          cat << 'EOF' > upload_single.py
          import os
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          if len(sys.argv) < 2:
              sys.exit(0)

          filepath = sys.argv[1]
          if not os.path.isfile(filepath):
              sys.exit(0)

          folder_id = os.environ.get('FOLDER_ID')
          sa_key_path = 'sa_key.json'
          filename = os.path.basename(filepath)
          filesize_mb = os.path.getsize(filepath) / (1024 * 1024)

          print(f"\n🚀 [דרייב] מתחיל העלאה מיידית: {filename} ({filesize_mb:.2f} MB)...", flush=True)

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file(sa_key_path, scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': filename,
              'parents': [folder_id]
          }

          media = MediaFileUpload(filepath, resumable=True, chunksize=10*1024*1024)
          request = service.files().create(body=file_metadata, media_body=media, fields='id')

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"⏳ [דרייב] {filename}: {int(status.progress() * 100)}%", flush=True)

          print(f"✅ [דרייב] הקובץ '{filename}' זמין כעת לצפייה בדרייב שלך!", flush=True)

          # מחיקת הקובץ מהשרת מיד בסיום ההעלאה כדי שלא יתפוס מקום
          try:
              os.remove(filepath)
          except:
              pass
          EOF

      # 5. הורדה והעלאה תוך כדי תנועה במקביל
      - name: Download and Stream to Google Drive
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p downloads

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${COUNT}:${QUERY}"
          fi

          echo "מתחיל תהליך הורדה והעלאה שוטף..."

          # הדגל --exec מפעיל את סקריפט ההעלאה מיד בסיום הורדת כל קובץ בודד
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --max-downloads "$COUNT" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
            --merge-output-format mp4 \
            -o "downloads/%(title).100s.%(ext)s" \
            --exec "python3 upload_single.py {} &" \
            "$TARGET_URL"

          # המתנה שכל ההעלאות שרצות ברקע יסתיימו לפני סיום ה-Workflow
          echo "ממתין לסיום ההעלאות האחרונות לדרייב..."
          wait

          echo "כל הסרטונים הועלו בהצלחה ל-Google Drive!"
          rm -f sa_key.json upload_single.py
