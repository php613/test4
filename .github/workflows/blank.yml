name: Download Latest Patriotim (Now14)

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'קישור ספציפי (השאר ריק למשיכת הפרק האחרון מאתר ערוץ 14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies & curl-cffi for Cloudflare bypass
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-pip
          # התקנת yt-dlp יחד עם curl-cffi לעקיפת הגנות Cloudflare
          pip install -U "yt-dlp[default,curl-cffi]" curl-cffi beautifulsoup4

      - name: Fetch from Now14 and Download
        run: |
          python3 - << 'EOF'
          from curl_cffi import requests
          import re
          import subprocess
          import sys

          custom_url = "${{ github.event.inputs.custom_url }}".strip()
          target_url = ""

          if custom_url:
              target_url = custom_url
              print(f"משתמש בקישור שהוזן: {target_url}")
          else:
              print("מתחבר לאתר עכשיו 14 עם עקיפת Cloudflare (curl_cffi)...")
              try:
                  # שימוש ב-curl_cffi להזדהות כדפדפן Chrome 120 אמיתי
                  s = requests.Session(impersonate="chrome120")
                  response = s.get("https://www.now14.co.il/programs/the-patriots/")
                  
                  if response.status_code == 200:
                      print("התחברות לאתר עברה בהצלחה (Cloudflare עוקף)!")
                      html = response.text
                      matches = re.findall(r'href=["\'](https://www.now14.co.il/[^"\']*פטריוטים[^"\']*)["\']', html)
                      if not matches:
                          matches = re.findall(r'href=["\'](https://www.now14.co.il/[^"\']+)["\']', html)
                          matches = [m for m in matches if 'patriot' in m or 'תוכנית' in m]

                      if matches:
                          target_url = matches[0]
                          print(f"נמצא פרק: {target_url}")
                      else:
                          target_url = "https://www.now14.co.il/programs/the-patriots/"
                  else:
                      print(f"סטטוס תשובה: {response.status_code}")
                      target_url = "https://www.now14.co.il/programs/the-patriots/"
              except Exception as e:
                  print(f"שגיאה: {e}")
                  target_url = "https://www.now14.co.il/programs/the-patriots/"

          # הורדה באמצעות yt-dlp תוך התחזות ל-Chrome
          cmd = [
              "yt-dlp",
              "--impersonate", "chrome",
              "-x",
              "--audio-format", "mp3",
              "-o", "episode.mp3",
              target_url
          ]
          print(f"מוריד מ- {target_url}...")
          res = subprocess.run(cmd)
          if res.returncode != 0:
              sys.exit(res.returncode)
          EOF

      - name: Split audio into .dat chunks
        run: |
          split -b 20M -d --additional-suffix=.dat episode.mp3 chunk_
          ls -lh chunk_*.dat

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="patriotim-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" chunk_*.dat \
            --title "הפטריוטים $(date +'%d/%m/%Y %H:%M')" \
            --notes "קבצי שמע מפוצלים"
