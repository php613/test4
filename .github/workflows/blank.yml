name: Search, Preview & Smart Downloader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש (או קישור ישיר לסרטון ספציפי/פלייליסט)'
        required: true
        type: string
      action_mode:
        description: 'פעולה מבוקשת'
        required: true
        default: 'download'
        type: choice
        options:
          - 'download'     # הורדת הסרטונים
          - 'list_only'    # הצגת שמות וקישורים בלבד תוך שניות (בלי להוריד וידאו)
      start_index:
        description: 'מאיזו תוצאה להתחיל?'
        required: true
        default: '1'
        type: string
      count:
        description: 'כמה תוצאות לסרוק/להוריד?'
        required: true
        default: '5'
        type: string
      quality:
        description: 'איכות וידאו (לבדיקה מהירה מומלץ 240p/360p, להורדה איכותית 1080p)'
        required: true
        default: '240'
        type: choice
        options:
          - '240'
          - '360'
          - '480'
          - '720'
          - '1080'

permissions:
  contents: write

jobs:
  process-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ytdlp-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp zip

          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider

      # הפקת טבלת שמות וקישורים (לוקח שניות בודדות)
      - name: Fetch Metadata & Titles Table
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          START: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          END=$(( START + COUNT - 1 ))
          
          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${END}:${QUERY}"
          fi

          echo "סורק שמות וכותרות מ-$START עד $END..."
          
          echo "### תוצאות סריקה עבור: \`$QUERY\`" > summary.md
          echo "**טווח תוצאות:** $START עד $END" >> summary.md
          echo "" >> summary.md
          echo "| מס׳ | כותרת הסרטון | משך זמן | קישור ישיר |" >> summary.md
          echo "| :--- | :--- | :--- | :--- |" >> summary.md

          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            --playlist-items "${START}:${END}" \
            --flat-playlist \
            --print "| %(playlist_index)s | %(title)s | %(duration_string)s | [צפייה / העתקת קישור](%(webpage_url)s) |" \
            "$TARGET_URL" >> summary.md

          cat summary.md >> $GITHUB_STEP_SUMMARY
          cat summary.md

      # הורדת הוידאו (מתבצע רק אם לא נבחר מצב list_only)
      - name: Download Videos
        if: ${{ github.event.inputs.action_mode == 'download' }}
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          START: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads
          END=$(( START + COUNT - 1 ))

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${END}:${QUERY}"
          fi

          echo "מוריד באיכות ${HEIGHT}p..."
          
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --playlist-items "${START}:${END}" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/worst" \
            --merge-output-format mp4 \
            -o "downloads/%(playlist_index)02d - %(title).100s.%(ext)s" \
            "$TARGET_URL"

      # כיווץ מקסימלי (zip -9) ופיצול
      - name: Maximum Compression & Split
        if: ${{ github.event.inputs.action_mode == 'download' }}
        run: |
          echo "דוחס ברמה מקסימלית (zip -9)..."
          zip -9 -r search_results.zip downloads/
          rm -rf downloads/

          echo "מפצל לנתחי 1950MB עם סיומת dat..."
          split -b 1950M -d --additional-suffix=.dat search_results.zip search_part_
          rm -f search_results.zip

      # העלאה ל-Release (רשימה בלבד או עם קבצי ה-dat)
      - name: Publish to GitHub Release
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          START: ${{ github.event.inputs.start_index }}
          COUNT: ${{ github.event.inputs.count }}
          MODE: ${{ github.event.inputs.action_mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END=$(( START + COUNT - 1 ))
          TAG="search-$(date +'%Y%m%d-%H%M%S')"

          if [ "$MODE" = "list_only" ]; then
            gh release create "$TAG" \
              --title "📋 רשימת כותרות: $QUERY ($START-$END)" \
              --notes-file summary.md
          else
            gh release create "$TAG" search_part_*.dat \
              --title "📦 תוצאות חיפוש: $QUERY ($START-$END)" \
              --notes-file summary.md
          fi
