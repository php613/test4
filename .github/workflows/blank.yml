name: Download Latest Patriotim (Cloudflare WARP)

on:
  workflow_dispatch:
    inputs:
      custom_url:
        description: 'קישור ספציפי (השאר ריק להורדה אוטומטית של הפרק האחרון)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg, Cloudflare WARP & Deno
        run: |
          # 1. הוספת המאגר הרשמי והתקנת Cloudflare WARP
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp
          
          # 2. הפעלת Cloudflare WARP במצב פרוקסי מקומי (פורט 40000)
          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 4
          
          # בדיקה שחיבור ה-WARP פעיל
          curl -x socks5h://127.0.0.1:40000 -s https://www.cloudflare.com/cdn-cgi/trace | grep warp

          # 3. התקנת Deno עבור פענוח של יוטיוב
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Start BotGuard Token Server & Install yt-dlp
        run: |
          # הפעלת שרת מקומי שמייצר אסימון "אני לא בוט" עבור יוטיוב
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          
          # התקנת yt-dlp עם תמיכת התחזות לדפדפן כרום (עוקף Cloudflare 403) ותוסף ה-PO Token
          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider

      - name: Download Audio
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.custom_url }}"
          else
            TARGET_URL="ytsearch1:עכשיו 14 הפטריוטים התוכנית המלאה"
          fi
          
          echo "מוריד מ: $TARGET_URL"
          
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -x --audio-format mp3 \
            -o "episode.mp3" \
            "$TARGET_URL"

      - name: Split audio into .dat chunks
        run: |
          split -b 20M -d --additional-suffix=.dat episode.mp3 chunk_
          ls -lh chunk_*.dat

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="patriotim-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" chunk_*.dat \
            --title "הפטריוטים $(date +'%d/%m/%Y %H:%M')" \
            --notes "קבצי שמע מפוצלים"
