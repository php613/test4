name: High Quality YouTube to Google Drive (Stable & Fast)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש או קישור ישיר לסרטון/פלייליסט'
        required: true
        type: string
      count:
        description: 'כמה סרטונים להוריד ולהעלות?'
        required: true
        default: '5'
        type: string
      quality:
        description: 'איכות וידאו מקסימלית'
        required: true
        default: '1080'
        type: choice
        options:
          - '720'
          - '1080'
          - '1440'
          - '2160'

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP לחסכון בזמן
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gdrive-stable-v2
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. התקנת כלים, רשת וספריות Google
      - name: Setup Tools & Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          pip install -U "yt-dlp[default,curl-cffi]" google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # 3. הכנת סקריפט העלאה של סרטון יחיד ברקע
      - name: Prepare Upload Script
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          echo "$GDRIVE_SA_KEY" > sa_key.json

          cat << 'EOF' > upload_single.py
          import os
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          if len(sys.argv) < 2:
              sys.exit(0)

          filepath = sys.argv[1]
          if not os.path.isfile(filepath):
              sys.exit(0)

          folder_id = os.environ.get('FOLDER_ID', '').strip()
          sa_key_path = 'sa_key.json'
          filename = os.path.basename(filepath)
          filesize_mb = os.path.getsize(filepath) / (1024 * 1024)

          print(f"\n🚀 [דרייב] מתחיל העלאה: {filename} ({filesize_mb:.2f} MB)...", flush=True)

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file(sa_key_path, scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': filename,
              'parents': [folder_id]
          }

          media = MediaFileUpload(filepath, resumable=True, chunksize=10*1024*1024)
          request = service.files().create(body=file_metadata, media_body=media, fields='id', supportsAllDrives=True)

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"⏳ [דרייב] {filename}: {int(status.progress() * 100)}%", flush=True)

          print(f"✅ [דרייב] הושלם בהצלחה: '{filename}'! מזהה: {response.get('id')}", flush=True)

          # מחיקת הקובץ מהשרת מיד בסיום ההעלאה
          try:
              os.remove(filepath)
          except:
              pass
          EOF

      # 4. בדיקת קבצים קיימים בדרייב (כולל תמיכה מלאה בתיקיות משותפות)
      - name: Sync Existing Drive Files
        env:
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          QUERY: ${{ github.event.inputs.search_query }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          python - << 'EOF'
          import os
          import subprocess
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          folder_id = os.environ.get('FOLDER_ID', '').strip()
          query = os.environ.get('QUERY', '').strip()
          count = os.environ.get('COUNT', '5').strip()

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file('sa_key.json', scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          existing_files = set()

          # ניסיון 1: שליפה מתוך התיקייה ישירות עם תמיכה בכל סוגי הדרייב
          page_token = None
          while True:
              try:
                  resp = service.files().list(
                      q=f"'{folder_id}' in parents and trashed = false",
                      pageSize=1000,
                      supportsAllDrives=True,
                      includeItemsFromAllDrives=True,
                      fields="nextPageToken, files(id, name)",
                      pageToken=page_token
                  ).execute()
                  for f in resp.get('files', []):
                      base = os.path.splitext(f['name'])[0].strip().lower()
                      existing_files.add(base)
                  page_token = resp.get('nextPageToken')
                  if not page_token:
                      break
              except Exception as e:
                  print(f"הערת סריקה 1: {e}")
                  break

          # ניסיון 2 (רשת ביטחון): אם לא אותרו קבצים בחיפוש לפי תיקייה, נסרוק את כל הקבצים ששותפו עם חשבון השירות
          if len(existing_files) == 0:
              page_token = None
              while True:
                  try:
                      resp = service.files().list(
                          q="trashed = false and mimeType != 'application/vnd.google-apps.folder'",
                          pageSize=1000,
                          supportsAllDrives=True,
                          includeItemsFromAllDrives=True,
                          fields="nextPageToken, files(id, name)",
                          pageToken=page_token
                      ).execute()
                      for f in resp.get('files', []):
                          base = os.path.splitext(f['name'])[0].strip().lower()
                          existing_files.add(base)
                      page_token = resp.get('nextPageToken')
                      if not page_token:
                          break
                  except Exception as e:
                      print(f"הערת סריקה 2: {e}")
                      break

          print(f"📁 נמצאו {len(existing_files)} קבצים קיימים בתיקיית הדרייב.", flush=True)

          if query.startswith('http://') or query.startswith('https://'):
              target = query
          else:
              target = f"ytsearch{count}:{query}"

          # שליפת מזהי הסרטונים ללא הורדה
          cmd = [
              "yt-dlp",
              "--proxy", "socks5://127.0.0.1:40000",
              "--extractor-args", "generic:impersonate",
              "--extractor-args", "youtube:player_client=android,ios,mweb",
              "--flat-playlist",
              "--print", "%(id)s\t%(title)s",
              target
          ]
          try:
              proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
              lines = proc.stdout.strip().split('\n')
              
              with open("archive.txt", "a", encoding="utf-8") as archive:
                  for line in lines:
                      if not line.strip() or '\t' not in line:
                          continue
                      v_id, v_title = line.split('\t', 1)
                      v_clean = v_title.strip().lower()
                      
                      # אם הקובץ כבר קיים בדרייב - רושמים בארכיון כדי לדלג עליו
                      is_present = False
                      for ex in existing_files:
                          if len(ex) > 3 and (ex in v_clean or v_clean in ex) or (v_id and v_id in ex):
                              is_present = True
                              break
                      
                      if is_present:
                          print(f"⏩ קיים כבר בדרייב (ידלג מראש): {v_title.strip()} ({v_id})")
                          archive.write(f"youtube {v_id}\n")
          except Exception as e:
              print(f"סריקה מקדימה דילגה על בדיקה: {e}")
          EOF

      # 5. הורדה והעלאה יציבה וללא שגיאות טוקנים
      - name: Download and Stream to Google Drive
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p downloads

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${COUNT}:${QUERY}"
          fi

          MAX_ATTEMPTS=2
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=================================================="
            echo "▶️ מתחיל סבב הורדה והעלאה $attempt מתוך $MAX_ATTEMPTS..."
            echo "=================================================="

            yt-dlp \
              --proxy "socks5://127.0.0.1:40000" \
              --extractor-args "generic:impersonate" \
              --extractor-args "youtube:player_client=android,ios,mweb" \
              -N 8 \
              --socket-timeout 20 \
              --retries 3 \
              --fragment-retries 3 \
              --download-archive "archive.txt" \
              --ignore-errors \
              --no-abort-on-error \
              --max-downloads "$COUNT" \
              --windows-filenames \
              -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
              --merge-output-format mp4 \
              -o "downloads/%(title).100s.%(ext)s" \
              --exec "python3 upload_single.py {} &" \
              "$TARGET_URL" || true

            echo "ממתין לסיום ההעלאות בסבב $attempt..."
            wait || true

            SUCCESS_COUNT=$(wc -l < archive.txt 2>/dev/null || echo 0)
            echo "עד כה טופלו בהצלחה: $SUCCESS_COUNT סרטונים."
            if [ "$SUCCESS_COUNT" -ge "$COUNT" ]; then
              echo "כל הסרטונים המבוקשים הסתיימו בהצלחה!"
              break
            fi
          done

          echo "התהליך הסתיים בהצלחה!"
          rm -f sa_key.json upload_single.py archive.txt
