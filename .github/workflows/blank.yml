name: High Quality YouTube to Google Drive (Private & Secure)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש או קישור ישיר לסרטון/פלייליסט'
        required: true
        type: string
      count:
        description: 'כמה סרטונים להוריד ולהעלות?'
        required: true
        default: '1'
        type: string
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '720'
          - '1080'
          - '1440'
          - '2160'

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. קאש עבור חבילות PIP
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gdrive-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      # 2. קאש עבור Deno
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      # 3. התקנת כלים, שירותים וספריות
      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp

          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # 4. הורדת הוידאו
      - name: Download Videos (High Quality)
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${COUNT}:${QUERY}"
          fi

          echo "מוריד באיכות ${HEIGHT}p..."
          
          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --max-downloads "$COUNT" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
            --merge-output-format mp4 \
            -o "downloads/%(title).100s.%(ext)s" \
            "$TARGET_URL"

          echo "הסרטונים ירדו בהצלחה לשרת."

      # 5. העלאה מאובטחת לדרייב ללא חשיפת פרטים
      - name: Secure Upload to Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SA_KEY" > sa_key.json

          python - << 'EOF'
          import os
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ.get('FOLDER_ID')
          if not folder_id:
              print("שגיאה: משתנה GDRIVE_FOLDER_ID אינו מוגדר ב-Secrets!")
              sys.exit(1)

          sa_key_path = 'sa_key.json'
          downloads_dir = 'downloads'

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file(sa_key_path, scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          files = [f for f in os.listdir(downloads_dir) if os.path.isfile(os.path.join(downloads_dir, f))]

          for filename in sorted(files):
              filepath = os.path.join(downloads_dir, filename)
              filesize_mb = os.path.getsize(filepath) / (1024 * 1024)
              print(f"מעלה לדרייב: {filename} ({filesize_mb:.2f} MB)...")

              file_metadata = {
                  'name': filename,
                  'parents': [folder_id]
              }
              
              media = MediaFileUpload(filepath, resumable=True, chunksize=10*1024*1024)
              request = service.files().create(body=file_metadata, media_body=media, fields='id')

              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"התקדמות: {int(status.progress() * 100)}%")

              print("הקובץ הועלה בהצלחה לתיקייה המאובטחת!")

          print("\nכל ההעלאות הסתיימו בהצלחה!")
          EOF

          # מחיקת קובץ המפתח מיד בסיום
          rm -f sa_key.json
