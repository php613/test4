name: High Quality YouTube to Google Drive (Streaming Upload)

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'טקסט לחיפוש או קישור ישיר לסרטון/פלייליסט'
        required: true
        type: string
      count:
        description: 'כמה סרטונים להוריד ולהעלות?'
        required: true
        default: '3'
        type: string
      quality:
        description: 'איכות וידאו מקסימלית'
        required: true
        default: '1080'
        type: choice
        options:
          - '720'
          - '1080'
          - '1440'
          - '2160'

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gdrive-v3
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-v1

      - name: Setup Tools & Services
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update && sudo apt-get install -y ffmpeg cloudflare-warp

          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider

          sudo systemctl enable --now warp-svc
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 3

          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
          fi
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # הכנת סקריפט העלאה יציב ומאובטח
      - name: Prepare Upload Script
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SA_KEY" > sa_key.json
          echo "$FOLDER_ID" > target_folder_id.txt

          cat << 'EOF' > upload_single.py
          import os
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          if len(sys.argv) < 2:
              sys.exit(0)

          filepath = sys.argv[1]
          if not os.path.isfile(filepath):
              sys.exit(0)

          # קריאת מזהה התיקייה ישירות מקובץ שמור
          try:
              with open('target_folder_id.txt', 'r') as f:
                  folder_id = f.read().strip()
          except Exception as e:
              print(f"❌ שגיאה בקריאת מזהה התיקייה: {e}", flush=True)
              sys.exit(1)

          sa_key_path = 'sa_key.json'
          filename = os.path.basename(filepath)
          filesize_mb = os.path.getsize(filepath) / (1024 * 1024)

          print(f"\n🚀 [דרייב] מתחיל העלאה: {filename} ({filesize_mb:.2f} MB)...", flush=True)

          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_file(sa_key_path, scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': filename,
              'parents': [folder_id]
          }

          try:
              media = MediaFileUpload(filepath, resumable=True, chunksize=10*1024*1024)
              # supportsAllDrives=True מאפשר העלאה לתיקיות משותפות
              request = service.files().create(
                  body=file_metadata, 
                  media_body=media, 
                  fields='id',
                  supportsAllDrives=True
              )

              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"⏳ [דרייב] {filename}: {int(status.progress() * 100)}%", flush=True)

              print(f"✅ [דרייב] הושלם בהצלחה: '{filename}'! מזהה: {response.get('id')}", flush=True)

              # פינוי שטח דיסק
              try:
                  os.remove(filepath)
              except:
                  pass

          except Exception as e:
              print(f"❌ שגיאה בהעלאת {filename}: {e}", flush=True)

          EOF

      # הורדה והעלאה שוטפת במקביל
      - name: Download and Stream to Google Drive
        env:
          QUERY: ${{ github.event.inputs.search_query }}
          COUNT: ${{ github.event.inputs.count }}
          HEIGHT: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p downloads

          if [[ "$QUERY" =~ ^https?:// ]]; then
            TARGET_URL="$QUERY"
          else
            TARGET_URL="ytsearch${COUNT}:${QUERY}"
          fi

          echo "מתחיל הורדה והעלאה שוטפת..."

          yt-dlp \
            --proxy "socks5://127.0.0.1:40000" \
            --extractor-args "generic:impersonate" \
            -N 8 \
            --max-downloads "$COUNT" \
            --windows-filenames \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best" \
            --merge-output-format mp4 \
            -o "downloads/%(title).100s.%(ext)s" \
            --exec "python3 upload_single.py {} &" \
            "$TARGET_URL"

          echo "ממתין לסיום כל תהליכי ההעלאה..."
          wait

          echo "התהליך הסתיים!"
          rm -f sa_key.json upload_single.py target_folder_id.txt
